name = "kazam-worker"
main = "src/index.ts"
compatibility_date = "2024-12-01"

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "kazam-db"
database_id = "7d3432c0-a68c-40f7-8b4b-0e31b18d0a58"

[durable_objects]
bindings = [
  { name = "ALERT_POLLER", class_name = "AlertPoller" }
]

[[migrations]]
tag = "v1"
new_classes = ["AlertPoller"]

[[queues.producers]]
queue = "kazam-notifications"
binding = "NOTIFICATION_QUEUE"

[[queues.consumers]]
queue = "kazam-notifications"
max_batch_size = 10
max_batch_timeout = 5

# Cron triggers (all times UTC):
# - 0 22 * * * = 00:00 IST (winter) / 01:00 IST (summer) — settle daily markets (after 23:59 IST close)
# - 30 19 * * * = 21:30 IST (winter) / 22:30 IST (summer) — "closing soon" FOMO reminders
# - 0 9 * * * = 11:00 IST (winter) / 12:00 IST (summer) — daily bonus reminders
[triggers]
# - 0 20 * * 0 = 22:00 IST Sunday — weekly leaderboard settlement
crons = ["0 22 * * *", "30 19 * * *", "0 9 * * *", "0 20 * * 0"]

[[kv_namespaces]]
binding = "ALERTS_CACHE"
id = "a187584d9d874a1ca7367d16427675e5"

[vars]
ENVIRONMENT = "production"
